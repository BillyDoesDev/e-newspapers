name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-6"   # 02:00 UTC = 07:30 IST, Monday to Saturday
  workflow_dispatch:        # keep the manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shillong-times
            args: --paper shillong-times --out output_dir
          - name: hindu
            args: --paper hindu
          # - name: third-script
          #   args: --out output_dir
    steps:
      - uses: actions/checkout@main

      - name: Run ${{ matrix.name }}
        run: docker compose run --rm --build e_newspaper_builder ${{ matrix.args }}

      - uses: actions/upload-artifact@main
        with:
          name: site-${{ matrix.name }}
          path: output_dir
          retention-days: 7 # 90 default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: site-*
          path: site            # each artifact lands in site/site-<name>/

      - name: Tidy folder names
        run: |
          cd site
          for d in site-*; do mv "$d" "${d#site-}"; done

      - uses: actions/configure-pages@main

      - uses: actions/upload-pages-artifact@main
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@main

# And in Settings -> Pages, Source must be GitHub Actions (not “Deploy from a branch”)
