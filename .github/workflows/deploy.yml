name: Build and deploy to GitHub Pages

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shillong-times
            args: --paper shillong-times --out output_dir
          - name: hindu
            args: --paper hindu
          - name: times-of-india
            args: --paper times-of-india
          - name: uttarbangasambad
            args: --paper uttarbangasambad
          - name: anandabazar-patrika
            args: --paper anandabazar-patrika
          # - name: third-script
          #   args: --out output_dir
    steps:
      - uses: actions/checkout@v7

      - name: Run ${{ matrix.name }}
        run: docker compose run --rm --build e_newspaper_builder ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.name }}
          path: output_dir
          retention-days: 7 # 90 default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7      # needed for site_index/index.html
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: site            # each artifact lands in site/site-<name>/

      - name: Tidy folder names
        run: |
          cd site
          for d in site-*; do mv "$d" "${d#site-}"; done

      - name: Generate top-level index.html
        run: |
          python3 site_index/build_index.py --site site --template site_index/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

# And in Settings -> Pages, Source must be GitHub Actions (not “Deploy from a branch”)
