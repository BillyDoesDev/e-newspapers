# GitLab CI equivalent of the "Build and deploy to GitHub Pages" workflow,
# running the uv script directly (no Docker-in-Docker).
#
# Setup notes:
#  - Schedule: CI/CD -> Schedules -> New schedule
#      Cron: 0 2-10/2 * * *   Timezone: UTC   Target branch: main
#    (GitLab schedules live in the UI, not in this file.)
#  - Manual run: CI/CD -> Pipelines -> Run pipeline (replaces workflow_dispatch).
#  - Pages: needs a job named `pages` that publishes a `public/` artifact.

workflow:
  auto_cancel:
    on_new_commit: interruptible   # roughly "cancel-in-progress"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - build
  - deploy

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

build:
  stage: build
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    entrypoint: [""]
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  parallel:
    matrix:
      - PAPER: shillong-times
        EXTRA_ARGS: "--out output_dir"
      - PAPER: [hindu, times-of-india, uttarbangasambad, anandabazar-patrika]
        EXTRA_ARGS: ""
  script:
    - uv sync --frozen --no-install-project --no-dev
    - uv run --frozen --no-dev main.py --paper "$PAPER" $EXTRA_ARGS
    # Give each paper its own folder so the artifacts merge cleanly in the deploy job
    - mkdir -p "site/$PAPER"
    - cp -r output_dir/. "site/$PAPER/"
  artifacts:
    name: "site-$PAPER"
    paths:
      - site/
    expire_in: 7 days

pages:
  stage: deploy
  image: alpine:latest
  needs:
    - build            # pulls artifacts from every matrix job
  resource_group: pages
  script:
    - mv site public
    - ls -R public | head -50
  artifacts:
    paths:
      - public
  environment:
    name: e-newspaper-builder
    url: $CI_PAGES_URL
